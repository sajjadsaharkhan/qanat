# Qanat on a server: `make prod-up` (see docs/deploy.md).
#
# One hostname, one port, routed by nginx:
#   https://$QANAT_DOMAIN/          dashboard (web)
#   https://$QANAT_DOMAIN/api/      control plane
#   https://$QANAT_DOMAIN/gateway/  gateway (Claude Code's ANTHROPIC_BASE_URL)
#
# TLS ends in front of nginx (Cloudflare or another proxy). Only nginx
# publishes a port; everything else stays on the compose network.
# Settings come from deploy/prod/.env, secrets from deploy/prod/secrets/.
#
# Images: CI publishes them to GHCR and deploy/prod/deploy.sh pulls them
# (IMAGE_TAG, default latest). Nothing is built on the server: there are no
# `build:` sections, so a missing image fails the deploy instead of building.
name: qanat

x-qanat-image: &qanat-image ${QANAT_IMAGE_REPO:-ghcr.io/sajjadsaharkhan/qanat}/qanat:${IMAGE_TAG:-latest}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-qanat-env: &qanat-env
  QANAT_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
  QANAT_REDIS_ADDR: redis:6379
  QANAT_MASTER_KEY_FILE: /run/secrets/master_key

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qanat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: qanat
    secrets: [postgres_password]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanat -d qanat"]
      interval: 2s
      retries: 15
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    restart: unless-stopped
    logging: *logging

  control:
    image: *qanat-image
    command: ["control"]
    environment:
      <<: *qanat-env
      QANAT_ROOT_PASSWORD_FILE: /run/secrets/root_password
      QANAT_PUBLIC_GATEWAY_URL: https://${QANAT_DOMAIN:?set QANAT_DOMAIN in deploy/prod/.env}/gateway
      QANAT_WEB_URL: https://${QANAT_DOMAIN}
      QANAT_OIDC_ISSUER: ${QANAT_OIDC_ISSUER:-}
      QANAT_OIDC_CLIENT_ID: ${QANAT_OIDC_CLIENT_ID:-qanat-dashboard}
      QANAT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    secrets: [postgres_dsn, master_key, root_password, oidc_client_secret]
    extra_hosts: ["host.docker.internal:host-gateway"] # proxies running on the host
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 2s
      retries: 30
    restart: unless-stopped
    logging: *logging

  gateway:
    image: *qanat-image
    command: ["gateway"]
    environment:
      <<: *qanat-env
      GOMEMLIMIT: 400MiB
    secrets: [postgres_dsn, master_key]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 2s
      retries: 30
    stop_grace_period: 10m # PRD §12.1: let streams finish
    restart: unless-stopped
    logging: *logging

  web:
    image: ${QANAT_IMAGE_REPO:-ghcr.io/sajjadsaharkhan/qanat}/web:${IMAGE_TAG:-latest}
    environment:
      QANAT_CONTROL_URL: http://control:8081
      QANAT_GATEWAY_URL: http://gateway:8080
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 2s
      retries: 30
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    environment:
      QANAT_DOMAIN: ${QANAT_DOMAIN}
    # The image renders templates/*.template into conf.d at start, filling in
    # only variables set here; default.conf.template replaces the stock site.
    volumes: ["./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    ports: ["${QANAT_HTTP_PORT:-80}:80"]
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

secrets: # generated by `make prod-up` on first run, never committed
  postgres_password: { file: ./secrets/postgres_password }
  postgres_dsn: { file: ./secrets/postgres_dsn }
  master_key: { file: ./secrets/master_key } # seals upstream credentials at rest (PRD §15.2); back it up
  root_password: { file: ./secrets/root_password }
  oidc_client_secret: { file: ./secrets/oidc_client_secret } # empty for a public client

volumes:
  postgres:
  redis:
