# Test edge: identical SSE settings to PRD §12.1, minus TLS.
# Acceptance and benchmark runs go through this file on purpose, so a
# regression in the Nginx config fails TestStreaming_NoBuffering.
upstream qanat_gateway {
    server gateway:8080;
    keepalive 64;
}

server {
    listen 80;

    location /v1/ {
        proxy_pass http://qanat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 32m;
        tcp_nodelay on;
    }

    location = /healthz {
        proxy_pass http://qanat_gateway;
    }
}
