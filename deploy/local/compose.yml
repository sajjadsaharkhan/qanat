# Qanat on your machine: `make local-up`, then open http://localhost:3000.
#
# Sign in as `root` with the password in deploy/local/secrets/root_password
# (generated by `make local-up`, never committed). Keycloak sign-in is not
# wired yet; the root admin signs in without it (PRD D23).
#
# Data persists in named volumes; `make local-reset` wipes it.
name: qanat-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qanat
      POSTGRES_PASSWORD: qanat-local # internal network only; no host port
      POSTGRES_DB: qanat
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanat -d qanat"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  control:
    build: { context: ../.., target: qanat }
    command: ["control"]
    environment:
      QANAT_POSTGRES_DSN: postgres://qanat:qanat-local@postgres:5432/qanat?sslmode=disable
      QANAT_REDIS_ADDR: redis:6379
      QANAT_ROOT_PASSWORD_FILE: /run/secrets/root_password
      QANAT_MASTER_KEY_FILE: /run/secrets/master_key
      QANAT_PUBLIC_GATEWAY_URL: http://localhost:${QANAT_GATEWAY_PORT:-18080}
      QANAT_INSECURE_COOKIES: "1" # plain HTTP on localhost
    secrets: [root_password, master_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 2s
      retries: 30

  gateway:
    build: { context: ../.., target: qanat }
    command: ["gateway"]
    environment:
      QANAT_POSTGRES_DSN: postgres://qanat:qanat-local@postgres:5432/qanat?sslmode=disable
      QANAT_REDIS_ADDR: redis:6379
      QANAT_MASTER_KEY_FILE: /run/secrets/master_key
      GOMEMLIMIT: 400MiB
    secrets: [master_key]
    ports: ["${QANAT_GATEWAY_PORT:-18080}:8080"]
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 2s
      retries: 30
    stop_grace_period: 10m

  web:
    build: { context: ../../web }
    environment:
      QANAT_CONTROL_URL: http://control:8081
    ports: ["${QANAT_WEB_PORT:-3000}:3000"]
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 2s
      retries: 30

secrets:
  root_password:
    file: ./secrets/root_password
  master_key: # seals upstream credentials at rest (PRD §15.2)
    file: ./secrets/master_key

volumes:
  postgres:
  redis:
