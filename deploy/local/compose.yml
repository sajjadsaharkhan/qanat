# Qanat on your machine: `make local-up`, then open http://localhost:3000.
#
# Sign in as `root` with the password in deploy/local/secrets/root_password
# (generated by `make local-up`, never committed), or with Keycloak.
#
# Keycloak is a throwaway dev instance (http://localhost:8180, admin/admin)
# with the realm in keycloak/qanat-realm.json imported when the container is created:
#   alice / alice      qanat-users, admin (BOOTSTRAP_ADMIN_EMAIL)
#   bob / bob          qanat-users, regular user
#   mallory / mallory  not in qanat-users, lands on Access denied
#
# Proxies on your machine are reachable from control and gateway as
# host.docker.internal (e.g. http://host.docker.internal:10808).
#
# Data persists in named volumes; `make local-reset` wipes it.
name: qanat-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qanat
      POSTGRES_PASSWORD: qanat-local # internal network only; no host port
      POSTGRES_DB: qanat
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanat -d qanat"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin # local dev only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser reaches Keycloak on localhost; control reaches it on the
      # compose network. Tokens carry the localhost issuer either way.
      KC_HOSTNAME: http://localhost:${QANAT_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["${QANAT_KEYCLOAK_PORT:-8180}:8080"]
    healthcheck: # the image has no curl/wget
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 40

  control:
    build: { context: ../.., target: qanat }
    command: ["control"]
    environment:
      QANAT_POSTGRES_DSN: postgres://qanat:qanat-local@postgres:5432/qanat?sslmode=disable
      QANAT_REDIS_ADDR: redis:6379
      QANAT_ROOT_PASSWORD_FILE: /run/secrets/root_password
      QANAT_MASTER_KEY_FILE: /run/secrets/master_key
      QANAT_PUBLIC_GATEWAY_URL: http://localhost:${QANAT_GATEWAY_PORT:-18080}
      QANAT_INSECURE_COOKIES: "1" # plain HTTP on localhost
      QANAT_WEB_URL: http://localhost:${QANAT_WEB_PORT:-3000}
      QANAT_OIDC_ISSUER: http://localhost:${QANAT_KEYCLOAK_PORT:-8180}/realms/qanat
      QANAT_OIDC_INTERNAL_URL: http://keycloak:8080/realms/qanat
      QANAT_OIDC_CLIENT_ID: qanat-dashboard
      BOOTSTRAP_ADMIN_EMAIL: alice@qanat.local
    secrets: [root_password, master_key]
    extra_hosts: ["host.docker.internal:host-gateway"] # proxy Test button reaches host proxies
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 2s
      retries: 30

  gateway:
    build: { context: ../.., target: qanat }
    command: ["gateway"]
    environment:
      QANAT_POSTGRES_DSN: postgres://qanat:qanat-local@postgres:5432/qanat?sslmode=disable
      QANAT_REDIS_ADDR: redis:6379
      QANAT_MASTER_KEY_FILE: /run/secrets/master_key
      GOMEMLIMIT: 400MiB
    secrets: [master_key]
    extra_hosts: ["host.docker.internal:host-gateway"] # host proxies
    ports: ["${QANAT_GATEWAY_PORT:-18080}:8080"]
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 2s
      retries: 30
    stop_grace_period: 10m

  web:
    build: { context: ../../web }
    environment:
      QANAT_CONTROL_URL: http://control:8081
      QANAT_GATEWAY_URL: http://gateway:8080
    ports: ["${QANAT_WEB_PORT:-3000}:3000"]
    depends_on:
      control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 2s
      retries: 30

secrets:
  root_password:
    file: ./secrets/root_password
  master_key: # seals upstream credentials at rest (PRD §15.2)
    file: ./secrets/master_key

volumes:
  postgres:
  redis:
