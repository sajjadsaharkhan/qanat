openapi: 3.1.0
info:
  title: Qanat Admin API
  version: 0.1.0
  description: |
    The control plane API behind the dashboard. Sessions are a first-party
    HttpOnly cookie (`qanat_session`). Every request that changes state must
    send the header `X-Qanat-Request: 1`.
servers:
  - url: /
paths:
  /api/auth/methods:
    get:
      operationId: authMethods
      summary: Which sign-in methods are enabled
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthMethods" } } } }
  /api/auth/login:
    post:
      operationId: login
      summary: Root admin password sign-in (D23)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "204": { description: Signed in; session cookie set }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
  /api/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start OIDC Authorization Code flow with PKCE
      parameters:
        - name: next
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to OIDC authorization endpoint }
  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC authorization callback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirect to dashboard or access denied }
  /api/me:
    get:
      operationId: me
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/quotas:
    get:
      operationId: myQuotas
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotas" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/keys:
    get:
      operationId: listKeys
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Key" } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createKey
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateKeyRequest" } } }
      responses:
        "201": { description: Created; the full key is in this response only, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedKey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/keys/{id}:
    delete:
      operationId: revokeKey
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /api/me/setup:
    get:
      operationId: setup
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Setup" } } } }
  /api/me/requests:
    get:
      operationId: recentRequests
      summary: The caller's last 200 requests (metadata only), newest first
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecentRequest" } } } }
  /api/me/usage:
    get:
      operationId: myUsage
      summary: The caller's usage by day, model and key
      parameters: [{ $ref: "#/components/parameters/Days" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UsageReport" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/me/usage/overview:
    get:
      operationId: myUsageOverview
      summary: The caller's usage Overview (9router layout)
      parameters: [{ $ref: "#/components/parameters/Period" }, { $ref: "#/components/parameters/Tz" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UsageOverview" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/usage/overview:
    get:
      operationId: adminUsageOverview
      summary: Everyone's usage Overview, or one person's with user_id
      parameters:
        - { $ref: "#/components/parameters/Period" }
        - { $ref: "#/components/parameters/Tz" }
        - { name: user_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UsageOverview" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/network:
    get:
      operationId: adminNetwork
      summary: Live network analytics per provider, merged from every gateway's report (nothing stored; last 30 minutes)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/NetworkOverview" } } }
  /api/admin/usage:
    get:
      operationId: adminUsage
      summary: Everyone's usage, plus each user's spend and quota state
      parameters: [{ $ref: "#/components/parameters/Days" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminUsage" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/usage/{id}:
    get:
      operationId: adminUserUsage
      summary: One user's usage report and quota windows
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Days" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserUsage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/usage:
    get:
      operationId: userUsage
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: All-time totals, content: { application/json: { schema: { $ref: "#/components/schemas/UsageTotals" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Account" } } } }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccountRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/{id}:
    patch:
      operationId: updateAccount
      summary: "Change an account's fields: label, base URL, auth kind, credential, expiry, disabled, proxy"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAccountRequest" } } }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAccount
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/validate:
    post:
      operationId: validateAccount
      summary: The Check button — probe a not-yet-stored credential against the provider's official endpoint
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ValidateAccountRequest" } } }
      responses:
        "200":
          description: Result of the check; ok=false is still a 200
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountTestResult" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/oauth/{provider}/authorize:
    get:
      operationId: oauthAuthorize
      summary: Start a provider sign-in — returns the authorize URL to open; the pending sign-in is kept server-side
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, description: "The dashboard's http://localhost:<port>/callback URL. Codex ignores it: its client only accepts http://localhost:1455/auth/callback, returned as redirect_uri, and the admin pastes the address the sign-in lands on." } }
      responses:
        "200":
          description: The URL to open
          content: { application/json: { schema: { $ref: "#/components/schemas/OAuthAuthorizeResult" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/oauth/{provider}/exchange:
    post:
      operationId: oauthExchange
      summary: Finish a sign-in — swaps the code for sealed tokens and creates (or re-signs-in) the OAuth account
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OAuthExchangeRequest" } } }
      responses:
        "200": { description: Existing account re-signed-in, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthExchangeResult" } } } }
        "201": { description: Account created, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthExchangeResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/{id}/test:
    post:
      operationId: testAccount
      summary: Check the stored credential against the provider's official endpoint, through the account's proxy (REQ-PROXY-01)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Result of the check; ok=false is still a 200
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountTestResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/{id}/limits:
    get:
      operationId: accountLimits
      summary: The account's remaining subscription quota, read from the provider's usage API through the account's proxy; cached for 5 minutes
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["1"] }, description: Skip the cache and ask the provider now }
      responses:
        "200":
          description: Limits, or supported=false for credentials without a usage API (API keys); a failed read is still a 200 with error set
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountLimits" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/accounts/{id}/move:
    post:
      operationId: moveAccount
      summary: Swap the account with its provider neighbor in pool order
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MoveAccountRequest" } } }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/providers/{provider}/models:
    get:
      operationId: providerModels
      summary: The provider's stored model catalog
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }
      responses:
        "200":
          description: The stored upstream model IDs
          content: { application/json: { schema: { $ref: "#/components/schemas/ProviderModels" } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: syncProviderModels
      summary: Re-fetch the catalog from the provider itself (with a stored account's credential) and replace the stored rows
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }
      responses:
        "200": { description: The fresh catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderModels" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/admin/proxies:
    get:
      operationId: listProxies
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Proxy" } } } }
    post:
      operationId: createProxy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProxyRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/proxies/{id}:
    put:
      operationId: updateProxy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProxyRequest" } } }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProxy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/proxies/{id}/test:
    post:
      operationId: testProxy
      summary: Egress IP, and latency and TLS to each provider, through the proxy (REQ-PROXY-05)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ProxyTestResult" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/proxy-groups:
    get:
      operationId: listProxyGroups
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProxyGroup" } } } }
    post:
      operationId: createProxyGroup
      summary: A failover or sticky group of proxies (PRD §8.1)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProxyGroupRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/proxy-groups/{id}:
    put:
      operationId: updateProxyGroup
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProxyGroupRequest" } } }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProxyGroup
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/provider-proxies:
    get:
      operationId: listProviderProxies
      summary: Each provider's proxy setting (PRD §8.2, level 2)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProviderProxy" } } } }
  /api/admin/provider-proxies/{provider}:
    put:
      operationId: setProviderProxy
      parameters: [{ name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAccountRequest" } } }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/provider-routing:
    get:
      operationId: listProviderRouting
      summary: How the gateway picks among each provider's accounts; providers without a setting show the defaults
      responses:
        "200":
          description: One entry per provider
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProviderRouting" } } } }
  /api/admin/provider-routing/{provider}:
    put:
      operationId: setProviderRouting
      parameters: [{ name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/Provider" } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProviderRoutingRequest" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderRouting" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/mappings:
    get:
      operationId: listMappings
      responses:
        "200":
          description: Exact rules first, then globs by priority
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MappingRule" } } } }
    put:
      operationId: replaceMappings
      summary: Replace the whole global mapping table
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MappingRule" } } } }
      responses:
        "204": { description: Replaced }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/providers:
    get:
      operationId: listProviders
      summary: The fixed provider registry and its model-name prefixes (cc/, cx/, ag/)
      responses:
        "200":
          description: Providers in display order
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProviderInfo" } } } }
  /api/admin/prices:
    get:
      operationId: listPrices
      responses:
        "200":
          description: Newest price version per model
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Price" } } } }
    post:
      operationId: setPrice
      summary: Add a confirmed price version, effective now. The model must be in a provider catalog or already priced
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/prices/{model}:
    delete:
      operationId: deletePrice
      summary: Remove a model's admin price; its built-in default (if any) applies again
      parameters:
        - { name: model, in: path, required: true, schema: { type: string }, description: Model id }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}:
    patch:
      operationId: updateUser
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserRequest" } } }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/disable:
    post:
      operationId: disableUser
      summary: Disable a user (reversible, keys kept) or ban them (every key revoked, reason required)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DisableUserRequest" } } }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/enable:
    post:
      operationId: enableUser
      summary: Lift a disable or ban; keys revoked by a ban stay revoked
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/quotas:
    get:
      operationId: userQuotas
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotas" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/quota/reset:
    post:
      operationId: resetQuota
      summary: Zero the chosen quota windows' current counters; recorded usage stays
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResetQuotaRequest" } } }
      responses:
        "204": { description: Reset }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/plans:
    get:
      operationId: listPlans
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } }
    post:
      operationId: createPlan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlanBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/plans/{id}:
    get:
      operationId: getPlan
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePlan
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlanBody" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePlan
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/audit:
    get:
      operationId: listAudit
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: Return entries older than this id }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Newest first
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Period: { name: period, in: query, required: false, description: Default today, schema: { type: string, enum: [today, 24h, 7d, 30d, 60d, all] } }
    Tz: { name: tz, in: query, required: false, description: IANA zone where "today" starts; default UTC, schema: { type: string } }
    Days: { name: days, in: query, required: false, description: Range ending today (UTC), default 30, schema: { type: integer, enum: [7, 30, 90] } }
  responses:
    Error:
      description: Error with a human-readable message
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthMethods:
      type: object
      required: [password, oidc]
      properties:
        password: { type: boolean }
        oidc: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Role: { type: string, enum: [user, admin] }
    Me:
      type: object
      required: [id, email, name, username, role, plan_id, plan_name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        username: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        plan_id: { type: string }
        plan_name: { type: string }
    WindowKind: { type: string, enum: [rolling_5h, daily, weekly, monthly] }
    UsageGroup:
      type: object
      required: [model, provider, requests, prompt_tokens, cached_tokens, completion_tokens, cost, last_used]
      properties:
        model: { type: string }
        provider: { type: string }
        requests: { type: integer, format: int64 }
        prompt_tokens: { type: integer, format: int64, description: Input + cache read + cache write }
        cached_tokens: { type: integer, format: int64, description: Cache reads (a subset of prompt tokens) }
        completion_tokens: { type: integer, format: int64 }
        cost: { type: number }
        last_used: { type: string, format: date-time }
        account_id: { type: string }
        account_name: { type: string }
        key_id: { type: string }
        key_name: { type: string }
        key_prefix: { type: string }
        user_email: { type: string }
        endpoint: { type: string }
    ChartBucket:
      type: object
      required: [start, tokens, cost, requests]
      properties:
        start: { type: string, format: date-time }
        tokens: { type: integer, format: int64 }
        cost: { type: number }
        requests: { type: integer, format: int64 }
    RecentUsage:
      type: object
      required: [timestamp, model, provider, prompt_tokens, completion_tokens, cached_tokens, status]
      properties:
        timestamp: { type: string, format: date-time }
        model: { type: string }
        provider: { type: string }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        cached_tokens: { type: integer, format: int64 }
        status: { type: string, enum: [ok, error] }
    UsageOverview:
      type: object
      required: [period, granularity, total_requests, total_prompt_tokens, total_cached_tokens, total_completion_tokens, total_cost,
                 by_provider, by_model, by_account, by_api_key, by_endpoint, chart, recent_requests, active_count, last_provider, error_provider, providers]
      properties:
        period: { type: string }
        granularity: { type: string, enum: [hour, day] }
        total_requests: { type: integer, format: int64 }
        total_prompt_tokens: { type: integer, format: int64 }
        total_cached_tokens: { type: integer, format: int64 }
        total_completion_tokens: { type: integer, format: int64 }
        total_cost: { type: number }
        by_provider: { type: array, items: { $ref: "#/components/schemas/UsageGroup" } }
        by_model: { type: array, items: { $ref: "#/components/schemas/UsageGroup" } }
        by_account: { type: array, items: { $ref: "#/components/schemas/UsageGroup" } }
        by_api_key: { type: array, items: { $ref: "#/components/schemas/UsageGroup" } }
        by_endpoint: { type: array, items: { $ref: "#/components/schemas/UsageGroup" } }
        chart: { type: array, items: { $ref: "#/components/schemas/ChartBucket" } }
        recent_requests: { type: array, items: { $ref: "#/components/schemas/RecentUsage" } }
        active_count: { type: integer, format: int64, description: Requests streaming now }
        last_provider: { type: string }
        error_provider: { type: string, description: Provider of an error in the last 10 seconds }
        providers: { type: array, items: { type: string } }
    UsageSums:
      type: object
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd, request_count, aborted_count]
      properties:
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        request_count: { type: integer, format: int64 }
        aborted_count: { type: integer, format: int64, description: Streams cut mid-way (REQ-QUOTA-01) }
    UsageReportTotals:
      allOf:
        - $ref: "#/components/schemas/UsageSums"
        - type: object
          required: [cache_hit_rate]
          properties:
            cache_hit_rate: { type: [number, "null"], description: Cache reads over input + cache read + cache write tokens }
    ModelUsage:
      allOf:
        - $ref: "#/components/schemas/UsageSums"
        - type: object
          required: [model, provider]
          properties:
            model: { type: string, description: Upstream model }
            provider: { $ref: "#/components/schemas/Provider" }
    UsageDay:
      type: object
      required: [date, models]
      properties:
        date: { type: string, format: date }
        models: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
    KeyUsage:
      type: object
      required: [key_id, name, user_email, revoked, tokens, cost_usd, request_count]
      properties:
        key_id: { type: string }
        name: { type: string }
        user_email: { type: string }
        revoked: { type: boolean }
        tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        request_count: { type: integer, format: int64 }
    UsageReport:
      type: object
      required: [days, since, totals, series, by_model, by_key]
      properties:
        days: { type: integer }
        since: { type: string, format: date }
        totals: { $ref: "#/components/schemas/UsageReportTotals" }
        series: { type: array, items: { $ref: "#/components/schemas/UsageDay" }, description: One entry per day, zero-filled }
        by_model: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
        by_key: { type: array, items: { $ref: "#/components/schemas/KeyUsage" } }
    UserUsage:
      type: object
      required: [id, email, name, username, role, plan_name, disabled, cost_usd, request_count, tokens, last_active, quotas, tightest]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        username: { type: [string, "null"] }
        role: { type: string, enum: [user, admin] }
        plan_name: { type: string }
        disabled: { type: boolean }
        cost_usd: { type: number }
        request_count: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        last_active: { type: [string, "null"], format: date }
        quotas: { type: array, items: { $ref: "#/components/schemas/QuotaWindow" } }
        tightest: { type: [number, "null"], description: Highest used/limit across quota windows; 1 = exhausted }
    AdminUsage:
      allOf:
        - $ref: "#/components/schemas/UsageReport"
        - type: object
          required: [users]
          properties:
            users: { type: array, items: { $ref: "#/components/schemas/UserUsage" } }
    AdminUserUsage:
      type: object
      required: [user, timezone, report]
      properties:
        user: { $ref: "#/components/schemas/UserUsage" }
        timezone: { type: string }
        report: { $ref: "#/components/schemas/UsageReport" }
    QuotaWindow:
      type: object
      required: [window, model_scope, limit_usd, used_usd, remaining_usd, resets_at]
      properties:
        window: { $ref: "#/components/schemas/WindowKind" }
        model_scope: { type: [string, "null"] }
        limit_usd: { type: number }
        used_usd: { type: number }
        remaining_usd: { type: number }
        resets_at: { type: [string, "null"], format: date-time }
    Quotas:
      type: object
      required: [timezone, windows]
      properties:
        timezone: { type: string }
        windows: { type: array, items: { $ref: "#/components/schemas/QuotaWindow" } }
    Key:
      type: object
      required: [id, name, prefix, expires_at, last_used_at, last_ip, revoked_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        last_ip: { type: [string, "null"] }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CreateKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        expires_in_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
    CreatedKey:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: The full key. Shown once. }
    Setup:
      type: object
      required: [gateway_url]
      properties:
        gateway_url: { type: string }
    User:
      type: object
      required: [id, email, name, username, role, plan_id, plan_name, active_keys, created_at, disabled_at, banned_at, disabled_reason]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        username: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        plan_id: { type: string }
        plan_name: { type: string }
        active_keys: { type: integer }
        created_at: { type: string, format: date-time }
        disabled_at: { type: [string, "null"], format: date-time, description: Set while an admin has disabled or banned the user }
        banned_at: { type: [string, "null"], format: date-time, description: Set when the disable is a ban }
        disabled_reason: { type: string }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        plan_id: { type: string }
    DisableUserRequest:
      type: object
      properties:
        ban: { type: boolean, description: Also revoke every API key; needs a reason }
        reason: { type: string, maxLength: 500 }
    ResetQuotaRequest:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          minItems: 1
          items:
            type: object
            required: [window, model_scope]
            properties:
              window: { $ref: "#/components/schemas/WindowKind" }
              model_scope: { type: [string, "null"] }
    PlanQuota:
      type: object
      required: [window, model_scope, limit_usd]
      properties:
        window: { $ref: "#/components/schemas/WindowKind" }
        model_scope: { type: [string, "null"] }
        limit_usd: { type: number, minimum: 0 }
    PlanLimits:
      type: object
      required: [rpm, max_concurrent]
      properties:
        rpm: { type: integer, minimum: 0, description: 0 = unlimited }
        max_concurrent: { type: integer, minimum: 0, description: 0 = unlimited }
    PlanBody:
      type: object
      required: [name, timezone, daily_anchor, weekly_anchor, monthly_anchor, quotas, limits, models]
      properties:
        name: { type: string }
        timezone: { type: string, description: IANA zone, e.g. Asia/Tehran }
        daily_anchor: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        weekly_anchor: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday, 6 = Saturday }
        monthly_anchor: { type: integer, minimum: 1, maximum: 28 }
        quotas: { type: array, items: { $ref: "#/components/schemas/PlanQuota" } }
        limits: { $ref: "#/components/schemas/PlanLimits" }
        models: { type: array, items: { type: string }, description: Allowed Qanat names; empty = all }
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanBody"
        - type: object
          required: [id, is_default, user_count, updated_at]
          properties:
            id: { type: string }
            is_default: { type: boolean }
            user_count: { type: integer }
            updated_at: { type: string, format: date-time }
    Provider: { type: string, enum: [claude, codex, antigravity] }
    Account:
      type: object
      required: [id, provider, label, base_url, has_credentials, state, cooldown_until, created_at, auth_kind, expires_at, disabled_at, last_check_at, last_check_ok, last_check_error, position, proxy]
      properties:
        id: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        label: { type: string }
        base_url: { type: [string, "null"] }
        has_credentials: { type: boolean }
        state: { type: string, enum: [healthy, cooldown, disconnected] }
        cooldown_until: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        auth_kind:
          type: string
          enum: [oauth, token, api_key]
          description: "oauth: signed in through the provider's own flow (sealed access + refresh tokens); token: sent upstream as a bearer token (e.g. a token from `claude setup-token`); api_key: sent as x-api-key. Codex and Antigravity accept oauth or api_key"
        expires_at: { type: [string, "null"], format: date-time, description: The credential's own expiry, when known }
        disabled_at: { type: [string, "null"], format: date-time, description: Set when an admin disabled the account; it takes no traffic }
        last_check_at: { type: [string, "null"], format: date-time, description: When the Test button last ran }
        last_check_ok: { type: [boolean, "null"], description: Result of the latest Test; 429 counts as valid }
        last_check_error: { type: [string, "null"] }
        email: { type: [string, "null"], description: The OAuth identity the provider reported; null for key/token accounts }
        last_refresh_at: { type: [string, "null"], format: date-time, description: When the OAuth tokens were last refreshed }
        last_refresh_error: { type: [string, "null"], description: Why the last token refresh failed; a permanent error means sign in again }
        position: { type: integer, format: int64, description: Pool order; the gateway tries accounts top-down }
        proxy: { $ref: "#/components/schemas/AccountProxy" }
    CreateAccountRequest:
      type: object
      required: [provider]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        label: { type: string }
        base_url: { type: [string, "null"], description: Overrides the provider endpoint }
        access_token: { type: [string, "null"], description: Sealed with the master key; never returned }
        auth_kind:
          type: string
          enum: [token, api_key]
          default: token
        expires_at: { type: [string, "null"], format: date-time }
        proxy: { $ref: "#/components/schemas/AccountProxy" }
    UpdateAccountRequest:
      type: object
      description: Partial update; absent fields are kept. access_token null keeps the stored credential, "" removes it, a value re-seals it. expires_at "" clears it.
      properties:
        label: { type: string }
        base_url: { type: [string, "null"] }
        auth_kind: { type: string, enum: [token, api_key] }
        access_token: { type: [string, "null"] }
        expires_at: { type: [string, "null"], description: RFC 3339 date-time }
        disabled: { type: boolean }
        proxy: { $ref: "#/components/schemas/AccountProxy" }
    MoveAccountRequest:
      type: object
      required: [direction]
      properties:
        direction: { type: string, enum: [up, down] }
    ValidateAccountRequest:
      type: object
      required: [provider, access_token]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        auth_kind: { type: string, enum: [token, api_key], default: token }
        base_url: { type: [string, "null"] }
        access_token: { type: string }
    AccountTestResult:
      type: object
      required: [ok, status, latency_ms]
      properties:
        ok: { type: boolean, description: The credential authenticated; 429 counts as valid }
        status: { type: integer, description: Upstream HTTP status, 0 on connection error }
        latency_ms: { type: integer, format: int64 }
        error: { type: string }
    LimitWindow:
      type: object
      required: [key, label, group, used_percent, resets_at]
      properties:
        key: { type: string, description: "Stable id: session, weekly, weekly_opus, a model id, …" }
        label: { type: string }
        group: { type: string, enum: [session, weekly, model] }
        used_percent: { type: number, description: 0–100 }
        resets_at: { type: [string, "null"], format: date-time }
    AccountLimits:
      type: object
      required: [account_id, supported, windows, limit_reached, fetched_at, stale]
      properties:
        account_id: { type: string }
        supported: { type: boolean, description: The provider publishes limits for this credential kind }
        plan: { type: string }
        windows: { type: array, items: { $ref: "#/components/schemas/LimitWindow" } }
        reset_credits: { type: integer, description: Limit-reset grants the account could spend (shown, never spent) }
        limit_reached: { type: boolean }
        fetched_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: The windows are the last good read; error says why the fresh one failed }
        error: { type: string }
    OAuthAuthorizeResult:
      type: object
      required: [auth_url, state, redirect_uri]
      properties:
        auth_url: { type: string, description: Open this in a popup; the provider redirects back to redirect_uri }
        state: { type: string, description: Echoed back to the exchange endpoint }
        redirect_uri: { type: string }
    OAuthExchangeRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code: { type: string, description: The authorization code; may still carry "#state" the way Claude's redirect does }
        state: { type: string, description: Empty when the state rode in as a "#fragment" on the code }
        redirect_uri: { type: string }
    OAuthExchangeResult:
      type: object
      required: [id, merged]
      properties:
        id: { type: string, description: The account ID }
        merged: { type: boolean, description: True when an existing account for the same identity was re-signed-in }
    ProviderModels:
      type: object
      required: [models]
      properties:
        models: { type: array, items: { type: string }, description: The provider's upstream model IDs }
    AccountProxy:
      type: string
      description: '"inherit" (next level of PRD §8.2: provider, then global default, else direct), "direct", a proxy ID, or "group:" + a proxy group ID'
    ProxyType: { type: string, enum: [http, https, socks5, socks5h] }
    NetworkOverview:
      type: object
      required: [generated_at, window_seconds, interval_seconds, gateways, internet, internet_history, providers]
      properties:
        generated_at: { type: string, format: date-time }
        window_seconds: { type: integer, description: Span of the summary statistics (5 minutes) }
        interval_seconds: { type: integer, description: Report, probe and history bucket cadence (10 seconds) }
        gateways: { type: array, items: { $ref: "#/components/schemas/NetworkGateway" }, description: Gateways reporting now; empty means no data }
        internet: { oneOf: [{ $ref: "#/components/schemas/NetworkProbe" }, { type: "null" }], description: "Gateways' own link: TCP connect to public IP literals (worst gateway)" }
        internet_history: { type: array, items: { $ref: "#/components/schemas/NetworkPoint" } }
        providers: { type: array, items: { $ref: "#/components/schemas/ProviderNetwork" } }
    NetworkGateway:
      type: object
      required: [instance, reported_at, started_at]
      properties:
        instance: { type: string }
        reported_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
    NetworkPoint:
      type: object
      required: [t]
      properties:
        t: { type: string, format: date-time }
        ms: { type: integer, format: int64, description: Absent when unreachable }
    NetworkState:
      type: string
      enum: [offline, unreachable, unstable, unavailable, degraded, checking, healthy, no_accounts]
      description: "Worst first. offline: the gateway's own network is down; unreachable: every route failed 2+ handshakes; unstable: real requests are failing upstream (3+ and half of attempts in 2 minutes); unavailable: no account can take traffic; degraded: slow or partly failing"
    NetworkStatus:
      type: object
      required: [state, since]
      properties:
        state: { $ref: "#/components/schemas/NetworkState" }
        reason:
          type: string
          description: "unreachable: dns, tcp, proxy, proxy_auth, tls, timeout. unavailable: disconnected, cooling, no_route, disabled. degraded: probe_failed, slow_internet, slow_handshake, error_rate, rate_limited, accounts_out. checking: no_gateway"
        since: { type: string, format: date-time }
    NetworkProbe:
      type: object
      required: [at, route, origin, ok, total_ms, fails, timeout_ms]
      description: One handshake (DNS, connect or proxy tunnel, TLS); no HTTP request is sent
      properties:
        at: { type: string, format: date-time }
        route: { type: string, description: Proxy ID or "direct" }
        origin: { type: string }
        ok: { type: boolean }
        dns_ms: { type: integer, format: int64, description: Absent when the proxy resolves the name }
        connect_ms: { type: integer, format: int64 }
        tls_ms: { type: integer, format: int64 }
        total_ms: { type: integer, format: int64 }
        error: { type: string, enum: [dns, tcp, proxy, proxy_auth, tls, timeout] }
        detail: { type: string }
        fails: { type: integer, description: Consecutive failures, this one included }
        timeout_ms: { type: integer, format: int64, description: "Adaptive deadline: 3× the slowest recent good handshake, 3–10 s" }
    RoutedProbe:
      allOf:
        - { $ref: "#/components/schemas/NetworkProbe" }
        - type: object
          required: [route_label]
          properties:
            route_label: { type: string }
    NetworkPercentiles:
      type: object
      required: [p50, p95]
      properties:
        p50: { type: [integer, "null"], format: int64 }
        p95: { type: [integer, "null"], format: int64 }
    NetworkStats:
      type: object
      required: [attempts, ok, errors, rejected, aborted, error_rate, per_minute, reasons, ttft_ms, latency_ms, overhead_ms]
      description: Over the window. Attempts count each upstream try, failovers included; rejected requests found no account
      properties:
        attempts: { type: integer, format: int64 }
        ok: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
        aborted: { type: integer, format: int64, description: The client went away }
        error_rate: { type: number }
        per_minute: { type: number }
        reasons: { type: object, additionalProperties: { type: integer, format: int64 } }
        ttft_ms: { $ref: "#/components/schemas/NetworkPercentiles" }
        latency_ms: { $ref: "#/components/schemas/NetworkPercentiles" }
        overhead_ms: { $ref: "#/components/schemas/NetworkPercentiles" }
        output_tps_p50: { type: number }
        last_success_at: { type: string, format: date-time }
        last_error_at: { type: string, format: date-time }
        last_error: { type: string }
    NetworkBucket:
      type: object
      required: [t, requests, errors, rejected, active]
      properties:
        t: { type: string, format: date-time }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
        ttft_p50_ms: { type: integer, format: int64 }
        ttft_p95_ms: { type: integer, format: int64 }
        handshake_ms: { type: integer, format: int64 }
        active: { type: integer }
    NetworkEvent:
      type: object
      required: [at, outcome]
      properties:
        at: { type: string, format: date-time }
        account: { type: string }
        account_label: { type: string }
        model: { type: string }
        status: { type: integer }
        outcome: { type: string, enum: [ok, error, rejected, aborted] }
        reason: { type: string }
        ttft_ms: { type: integer, format: int64 }
        overhead_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        output_tps: { type: number }
    AccountNetwork:
      type: object
      required: [id, label, state, disabled, usable, active, cooling_until, attempts, errors, ttft_p50_ms, last_success_at]
      properties:
        id: { type: string }
        label: { type: string }
        state: { type: string }
        disabled: { type: boolean }
        usable: { type: boolean, description: A gateway would route to it now }
        active: { type: integer }
        cooling_until: { type: [string, "null"], format: date-time }
        attempts: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        ttft_p50_ms: { type: [integer, "null"], format: int64 }
        last_success_at: { type: [string, "null"], format: date-time }
    ProviderNetwork:
      type: object
      required: [id, name, prefix, status, active_connections, stats, accounts, probes, history, recent, refreshed_at, last_probe_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        status: { $ref: "#/components/schemas/NetworkStatus" }
        active_connections: { type: integer, description: Responses streaming now }
        stats: { $ref: "#/components/schemas/NetworkStats" }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountNetwork" } }
        probes: { type: array, items: { $ref: "#/components/schemas/RoutedProbe" } }
        history: { type: array, items: { $ref: "#/components/schemas/NetworkBucket" } }
        recent: { type: array, items: { $ref: "#/components/schemas/NetworkEvent" }, description: Newest first }
        refreshed_at: { type: [string, "null"], format: date-time, description: Newest gateway report that included it }
        last_probe_at: { type: [string, "null"], format: date-time }
    Proxy:
      type: object
      required: [id, label, type, host, port, username, has_password, enabled, is_default, account_count, created_at, health]
      properties:
        id: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/ProxyType" }
        host: { type: string }
        port: { type: integer }
        username: { type: [string, "null"] }
        has_password: { type: boolean }
        enabled: { type: boolean }
        is_default: { type: boolean, description: Used by accounts and providers set to inherit }
        account_count: { type: integer, format: int64, description: Accounts assigned to this proxy directly }
        created_at: { type: string, format: date-time }
        health: { type: array, items: { $ref: "#/components/schemas/ProxyHealth" }, description: "Gateways' latest periodic check per upstream origin (REQ-PROXY-03); empty when no account routes through it" }
    ProxyHealth:
      type: object
      required: [proxy_id, origin, healthy, ok, latency_ms, at]
      properties:
        proxy_id: { type: string }
        origin: { type: string, description: "Upstream scheme://host, e.g. https://api.anthropic.com" }
        healthy: { type: boolean, description: False after 2 failed checks in a row; unhealthy proxies carry no traffic }
        ok: { type: boolean, description: Result of the latest check alone }
        latency_ms: { type: integer, format: int64 }
        error: { type: string }
        at: { type: string, format: date-time }
    ProxyGroupPolicy:
      type: string
      enum: [failover, sticky]
      description: "failover: members in order, unhealthy ones skipped. sticky: each account always uses one member"
    ProxyGroup:
      type: object
      required: [id, label, policy, members, account_count, created_at]
      properties:
        id: { type: string }
        label: { type: string }
        policy: { $ref: "#/components/schemas/ProxyGroupPolicy" }
        members: { type: array, items: { type: string }, description: Proxy IDs in failover order }
        account_count: { type: integer, format: int64, description: Accounts assigned to this group directly }
        created_at: { type: string, format: date-time }
    ProxyGroupRequest:
      type: object
      required: [label, policy, members]
      properties:
        label: { type: string }
        policy: { $ref: "#/components/schemas/ProxyGroupPolicy" }
        members: { type: array, items: { type: string }, minItems: 1 }
    ProviderRoutingRequest:
      type: object
      required: [strategy, sticky_limit, min_headroom_pct]
      properties:
        strategy:
          type: string
          enum: [sticky-balanced, round-robin, fill-first]
          description: "sticky-balanced: each user stays on one account (its prompt cache stays warm); new users and users idle past the cache lifetime go to the least-loaded account, weighted by quota left. round-robin: each user keeps an account for sticky_limit requests, then moves to the least recently used one. fill-first: pool order, the user's last good account first"
        sticky_limit: { type: integer, minimum: 1, maximum: 1000, description: Requests in a row on one account before rotating (round-robin only) }
        min_headroom_pct: { type: integer, minimum: 0, maximum: 100, description: Accounts with less subscription quota left than this are tried last }
    ProviderRouting:
      allOf:
        - { $ref: "#/components/schemas/ProviderRoutingRequest" }
        - type: object
          required: [provider]
          properties:
            provider: { $ref: "#/components/schemas/Provider" }
    ProviderProxy:
      type: object
      required: [provider, proxy]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        proxy: { $ref: "#/components/schemas/AccountProxy" }
    ProxyRequest:
      type: object
      required: [type, host, port]
      properties:
        label: { type: string, description: Defaults to host:port }
        type: { $ref: "#/components/schemas/ProxyType" }
        host: { type: string }
        port: { type: integer }
        username: { type: [string, "null"] }
        password: { type: [string, "null"], description: 'Sealed; never returned. On update null keeps the stored one, "" removes it' }
        enabled: { type: [boolean, "null"], description: Defaults to true; null keeps the current value on update }
        is_default: { type: boolean }
    ProxyTestResult:
      type: object
      required: [egress_ip, providers, proxy_reachable]
      properties:
        egress_ip: { type: string, description: Empty when the IP echo service couldn't be reached }
        egress_error: { type: string }
        location: { $ref: "#/components/schemas/ProxyLocation" }
        proxy_reachable: { type: boolean }
        providers: { type: array, items: { $ref: "#/components/schemas/ProxyProbe" } }
    ProxyLocation:
      type: object
      description: Approximate geo-IP location of the egress IP; absent when the lookup service doesn't report one
      properties:
        city: { type: string }
        region: { type: string }
        country: { type: string, description: "ISO 3166-1 alpha-2, e.g. SE" }
        org: { type: string, description: Network operator, e.g. AS215960 Example GmbH }
        timezone: { type: string }
    ProxyProbe:
      type: object
      required: [provider, host, ok, latency_ms]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        host: { type: string }
        ok: { type: boolean }
        latency_ms: { type: integer, format: int64, description: Connect, TLS and first response, through the proxy }
        tls_version: { type: string }
        status: { type: integer }
        error: { type: string }
    ProviderInfo:
      type: object
      required: [id, prefix, name, families]
      properties:
        id: { $ref: "#/components/schemas/Provider" }
        prefix: { type: string, description: "Model-name prefix without the slash; cc/<model> routes <model> to this provider" }
        name: { type: string }
        families: { type: array, items: { type: string }, description: Model-name prefixes listed under this provider in /v1/models }
    MappingRule:
      type: object
      required: [pattern, provider, upstream_model, priority]
      properties:
        pattern: { type: string, description: "Exact name or glob (claude-*). Never provider-prefixed: cc/<name> applies the rule for <name> on Claude" }
        provider: { $ref: "#/components/schemas/Provider" }
        upstream_model: { type: [string, "null"], description: null keeps the incoming name }
        priority: { type: integer, description: Lower first, among globs }
    Price:
      type: object
      required: [version, model_id, p_in, p_out, p_cache_read, p_cache_write, effective_from, confirmed_at, source, has_default]
      properties:
        version: { type: integer, format: int64 }
        model_id: { type: string, description: "The provider's model id (as in its catalog), never provider-prefixed" }
        source: { type: string, enum: [admin, default], description: "default: built-in price (after 9router); admin: set by an admin, always wins" }
        has_default: { type: boolean, description: Deleting the admin price falls back to a built-in default }
        p_in: { type: number }
        p_out: { type: number }
        p_cache_read: { type: number }
        p_cache_write: { type: number }
        effective_from: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
    PriceRequest:
      type: object
      required: [model_id, p_in, p_out, p_cache_read, p_cache_write]
      properties:
        model_id: { type: string, description: "A model id a provider's catalog lists, or one that already has a price; a provider prefix (cc/, cx/, ag/) is removed" }
        p_in: { type: number, minimum: 0, description: USD per 1M input tokens }
        p_out: { type: number, minimum: 0 }
        p_cache_read: { type: number, minimum: 0 }
        p_cache_write: { type: number, minimum: 0 }
    UsageTotals:
      type: object
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd, request_count]
      properties:
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_usd: { type: number }
        request_count: { type: integer }
    RecentRequest:
      type: object
      required: [request_id, at, model, provider, upstream_model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_micro, status, aborted, ttft_ms, duration_ms]
      properties:
        request_id: { type: string }
        at: { type: string, format: date-time }
        model: { type: string }
        provider: { type: string }
        upstream_model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_micro: { type: integer, description: Cost in millionths of a USD }
        status: { type: integer }
        aborted: { type: boolean }
        stop_reason: { type: string }
        ttft_ms: { type: integer }
        duration_ms: { type: integer }
        error: { type: string }
    AuditEntry:
      type: object
      required: [id, actor_id, actor_email, action, entity, entity_id, before, after, at]
      properties:
        id: { type: integer, format: int64 }
        actor_id: { type: [string, "null"] }
        actor_email: { type: string }
        action: { type: string }
        entity: { type: string }
        entity_id: { type: [string, "null"] }
        before: {}
        after: {}
        at: { type: string, format: date-time }
