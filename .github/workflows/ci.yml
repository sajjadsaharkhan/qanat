name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (lint, unit, race, reference acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make lint
      - run: make test-race
      - run: make test-reference
      - run: make fixtures-check

  integration:
    name: integration (Redis, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: qanat, POSTGRES_PASSWORD: qanat, POSTGRES_DB: qanat_test }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U qanat" --health-interval 2s --health-retries 15
    env:
      QANAT_TEST_REDIS_ADDR: localhost:56379
      QANAT_TEST_POSTGRES_DSN: postgres://qanat:qanat@localhost:55432/qanat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...

  acceptance:
    name: acceptance + latency gate (real stack via Nginx)
    # Activates automatically once the gateway binary exists (P0).
    if: ${{ hashFiles('cmd/gateway/main.go') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test-acceptance
      - name: latency gate
        env: { QANAT_BENCH_KEY: "${{ secrets.QANAT_BENCH_KEY || 'qnt_live_bench_seeded' }}" }
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-result, path: bench/result.json }
      - if: always()
        run: docker compose -f deploy/test/compose.test.yml --profile stack logs > stack.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: stack-logs, path: stack.log }

  web:
    name: web (typecheck, unit, e2e light/dark)
    if: ${{ hashFiles('web/package-lock.json') != '' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # e2e needs the control plane + oidcmock, so it starts once the stack exists (P0).
      - name: start stack
        if: ${{ hashFiles('cmd/control/main.go') != '' }}
        working-directory: .
        run: make stack-up
      - if: ${{ hashFiles('cmd/control/main.go') != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ hashFiles('cmd/control/main.go') != '' }}
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }
